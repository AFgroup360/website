<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client portal | AmeriFinancial</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08162f">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/icon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/main.css">

<style>
  .portal-main { padding-block: clamp(3rem, 2rem + 3vw, 5rem); }
  .portal-card { background: var(--white); border: 1px solid var(--rule); padding: clamp(1.5rem, 1rem + 2vw, 2.25rem); }
  .portal-help { margin-top: var(--space-5); font-size: var(--text-xs); color: var(--text-muted); }
  .portal-help a, .portal-card .lede a { color: var(--accent-text); font-weight: 600; }
</style>
</head>
<body>
<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="../index.html" aria-label="AmeriFinancial, back to the website">
      <img class="brand__lockup" src="../assets/img/logo-lockup.png" alt="AmeriFinancial"
           width="1182" height="150">
    </a>
  </div>
</header>
<main class="portal-main">
  <section class="section">
    <div class="container">
      <div class="portal-card" style="max-width:34rem">
        <span class="overline">Client portal</span>
        <h1 style="font-size:var(--text-h2)">Not available on this address.</h1>
        <p class="lede">The portal runs on the live site at
          <a href="https://ameri-group.ca/portal/">ameri-group.ca/portal</a>. This
          address is a preview copy, which cannot run it.</p>
        <p class="portal-help">If you are a client and cannot get in, email
          <a href="mailto:hello@ameri-group.ca">hello@ameri-group.ca</a>.</p>
      </div>
    </div>
  </section>
</main>
</body>
</html>
